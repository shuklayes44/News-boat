name: Run News Bot

on:
  schedule:
    - cron: '0 0 * * *'    # 5:30 AM IST
    - cron: '24 2 * * *'   # 7:54 AM IST
    - cron: '48 4 * * *'   # 10:18 AM IST
    - cron: '12 7 * * *'   # 12:42 PM IST
    - cron: '36 9 * * *'   # 3:06 PM IST
    - cron: '0 12 * * *'   # 5:30 PM IST
    - cron: '24 14 * * *'  # 7:54 PM IST
    - cron: '48 16 * * *'  # 10:18 PM IST
    - cron: '12 19 * * *'  # 12:42 AM IST
    - cron: '36 21 * * *'  # 3:06 AM IST
  workflow_dispatch:

jobs:
  run-python-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests google-genai feedparser

      - name: Random Human-like Delay
        run: |
          DELAY=$(( RANDOM % 1200 ))
          echo "Sleeping for $DELAY seconds (~$((DELAY/60)) min) before posting..."
          sleep $DELAY

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py
