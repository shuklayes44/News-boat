name: Run News Bot

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '12 1 * * *'
    - cron: '24 2 * * *'
    - cron: '36 3 * * *'
    - cron: '48 4 * * *'
    - cron: '0 6 * * *'
    - cron: '12 7 * * *'
    - cron: '24 8 * * *'
    - cron: '36 9 * * *'
    - cron: '48 10 * * *'
    - cron: '0 12 * * *'
    - cron: '12 13 * * *'
    - cron: '24 14 * * *'
    - cron: '36 15 * * *'
    - cron: '48 16 * * *'
    - cron: '0 18 * * *'
    - cron: '12 19 * * *'
    - cron: '24 20 * * *'
    - cron: '36 21 * * *'
    - cron: '48 22 * * *'
  workflow_dispatch:
    inputs:
      custom_headline:
        description: 'Custom headline (chhod do agar normal auto-post chahiye)'
        required: false
        default: ''
      custom_category:
        description: 'Category (india/global/geopolitics/technology/stock market/economic)'
        required: false
        default: 'technology'

jobs:
  run-python-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests google-genai feedparser

      - name: Random Human-like Delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 600 ))
          echo "Sleeping for $DELAY seconds (~$((DELAY/60)) min) before posting..."
          sleep $DELAY

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CUSTOM_HEADLINE: ${{ github.event.inputs.custom_headline }}
          CUSTOM_CATEGORY: ${{ github.event.inputs.custom_category }}
        run: |
          python main.py

      - name: Save posted-history back to repo
        run: |
          if [ -f posted_history.json ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add posted_history.json
            git diff --staged --quiet || git commit -m "Update posted history [skip ci]"
            git push
          fi
