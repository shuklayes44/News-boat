name: Run News Bot

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'  # 8x/day, every 3 hours (IST: 5:30, 8:30, 11:30, 2:30, 5:30, 8:30, 11:30, 2:30)
  workflow_dispatch:

jobs:
  run-python-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests google-genai feedparser

      - name: Random Human-like Delay
        run: |
          DELAY=$(( RANDOM % 1200 ))
          echo "Sleeping for $DELAY seconds (~$((DELAY/60)) min) before posting, to avoid an exact robotic schedule..."
          sleep $DELAY

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          python main.py
